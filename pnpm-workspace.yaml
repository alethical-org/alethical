packages:
  - apps/frontend

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
nodeLinker: hoisted

overrides:
  "@react-navigation/core": 7.17.2
  "@react-navigation/elements": 2.9.15
  "@react-navigation/routers": 7.5.3
  "@supabase/phoenix": 0.4.1
  "@expo/xcpretty": 4.4.3

  # Security overrides for Dependabot alerts (#691). Every package below is
  # build tooling — none of it reaches a browser, which was measured against the
  # web export's source maps rather than assumed. They are patched anyway so the
  # alert list stays readable: 49 permanent alerts is how a genuinely shipped
  # one gets missed.
  #
  # These are overrides rather than direct bumps because every one is a
  # transitive dependency we do not declare, and upstream has not moved:
  # eas-cli@21.4.0, the newest release, still pins the vulnerable joi, ajv,
  # diff, minimatch, yaml and uuid. Each override stays inside the parent's
  # existing major version. Remove any of them once its parent ships the fix.
  #
  # Where a fix is blocked, pin the highest version the 7-day minimumReleaseAge
  # above will actually allow, rather than skipping the package entirely — most
  # advisories are fixed by an older release than the newest one. tar is the
  # case in point: only one of its nine advisories needs 7.5.21 (Jul 21, still
  # too new), and 7.5.20 clears the other eight.
  #
  # Still unpatched, all equally browser-unreachable: tar's last advisory and
  # brace-expansion 5.0.8 (Jul 23), both of which simply age into eligibility
  # on Jul 30; and uuid, ts-deepmerge, diff and @xmldom/xmldom, which would
  # need major-version jumps underneath eas-cli, xcode and @expo/plist —
  # risking the native iOS and Android build that CI never exercises, for no
  # browser-facing gain.
  "@babel/core": 7.29.6 # 85 Babel plugins — arbitrary file read via sourceMappingURL
  ajv: 8.18.0 # eas-cli — ReDoS via the $data option
  brace-expansion: 5.0.7 # via minimatch — DoS via exponential expansion
  form-data: 4.0.6 # eas-cli — CRLF injection in multipart field names
  joi: 17.13.4 # eas-cli — uncaught RangeError on deeply nested input
  "js-yaml@3": 3.15.0 # @oclif/core, istanbul — quadratic-complexity DoS
  "js-yaml@4": 4.3.0 # @expo/xcpretty — quadratic-complexity DoS
  "minimatch@5": 5.1.8 # eas-cli, filelist — three ReDoS advisories
  "minimatch@3.1.5>brace-expansion": 2.1.2 # the 2.x line of the same DoS
  node-forge: 1.4.0 # eas-cli held 1.3.1; dedupes onto the copy already present
  postcss: 8.5.18 # @expo/metro-config — build-time CSS only, never our output
  shell-quote: 1.9.0 # react-devtools-core — the CVE-2026-9277 critical
  tar: 7.5.20 # eas-cli — clears 8 of 9, including the CVE-2026-59873 critical
  "ws@7": 7.5.11 # metro, react-native dev server
  "ws@8": 8.21.0 # @expo/cli and @supabase/realtime-js (which never imports it)
  yaml: 2.8.4 # eas-cli held 2.6.0; dedupes onto metro-config's copy
