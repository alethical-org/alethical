[project]
name = "alethical"
version = "0.1.0"
description = "Alethical backend and ingestion system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5",
  "sqlalchemy>=2.0.39",
  "psycopg[binary]>=3.2.6",
  # Imported directly by alethical/pipeline/oban.py. Reached us only through
  # oban's own requirements until now, so an oban release that stopped needing
  # it would have broken the pipeline with no lockfile change of ours.
  "psycopg-pool>=3.3.1",
  "pgvector>=0.4.1",
  "requests>=2.33.0",
  "fastapi>=0.135.1",
  # Imported directly by alethical/api/main.py for the exception handler, and
  # floored at 1.3.1 because that release fixes five advisories (#681). fastapi
  # allows starlette>=0.46.0 with no ceiling, so without this floor a future
  # fastapi bump could resolve starlette backwards and silently reopen them.
  "starlette>=1.3.1",
  "uvicorn>=0.42.0",
  "pydantic>=2.12.5",
  "pytest>=9.0.3",
  "httpx>=0.28.1",
  "pytest-asyncio>=1.3.0",
  "supabase>=2.28.3",
  # Imported directly by the retrieval eval harness. It arrived only via
  # supabase's requirements, and supabase 2.31.0 drops it (#693), which is how
  # the missing declaration surfaced.
  "numpy>=2.4.3",
  "oban>=0.6.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["alethical/tests"]
pythonpath = ["."]
