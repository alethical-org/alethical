[project]
name = "alethical"
version = "0.1.0"
description = "Alethical backend and ingestion system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5",
  "sqlalchemy>=2.0.51",
  "psycopg[binary]>=3.3.4",
  # Imported directly by alethical/pipeline/oban.py. Reached us only through
  # oban's own requirements until now, so an oban release that stopped needing
  # it would have broken the pipeline with no lockfile change of ours.
  "psycopg-pool>=3.3.1",
  "pgvector>=0.5.0",
  "requests>=2.34.2",
  # District lookup geometry must preserve holes and boundary points while it is
  # reduced for the browser. Shapely provides the topology-aware operations.
  "shapely>=2.1.2",
  # The reviewed district-map build script converts Minnesota's official map
  # coordinates to browser coordinates. Declare pyproj directly so rebuilding
  # the checked-in map never depends on an unrelated package pulling it in.
  "pyproj>=3.7.2",
  "fastapi>=0.141.1",
  # Imported directly by alethical/api/main.py for the exception handler, and
  # floored at 1.3.1 because that release fixes five advisories (#681). fastapi
  # allows starlette>=0.46.0 with no ceiling, so without this floor a future
  # fastapi bump could resolve starlette backwards and silently reopen them.
  "starlette>=1.3.1",
  "uvicorn>=0.52.0",
  "pydantic>=2.13.4",
  # Contact form addresses need standards-based server validation before they
  # become the reply path and the recipient of the sender's copy (#1274).
  "email-validator>=2.3.0",
  "pytest>=9.1.1",
  # Starlette's test client now runs on httpx2. Keep plain httpx below for the
  # production services and Supabase packages that still import it directly.
  "httpx2>=2.0.0",
  "httpx>=0.28.1",
  "pytest-asyncio>=1.4.0",
  "supabase>=2.31.0",
  # Imported directly by alethical/tests/test_auth_token_verification.py for
  # AuthInvalidJwtError, the error a rejected or expired sign-in token really
  # raises. `supabase` re-exports the AuthError base class but not this subclass,
  # so the token tests reach past it, and it arrived here only through supabase's
  # own requirements (#115).
  "supabase-auth>=2.31.0",
  # Imported directly by the retrieval eval harness. It arrived only via
  # supabase's requirements, and supabase 2.31.0 drops it (#693), which is how
  # the missing declaration surfaced.
  "numpy>=2.5.1",
  "oban>=0.6.5",
  # The campaign-finance loader keeps each downloaded file's exact bytes in a
  # private Supabase Storage bucket, reached over the S3 protocol with
  # Storage-scoped credentials rather than a service-role key, so a leaked
  # credential cannot touch the database (#1328). botocore is declared alongside
  # it because `raw_file_store.py` imports it directly for its error types, and
  # it reaches us today only because boto3 happens to require it (#701).
  "boto3>=1.43.69",
  "botocore>=1.43.69",
  # The only half of the campaign-finance reconciliation that can catch our payment
  # rows being SHORT lives inside each committee's filed report document, which the
  # Board publishes as a PDF and nowhere else (#1433). pypdf reads the text out of
  # one; it is pure Python with no system libraries behind it, so it adds nothing to
  # the deployed image beyond itself. Nothing is rebuilt from those documents -- one
  # stated subtotal is read per schedule and the payment rows keep coming from the
  # bulk download (§2.3).
  "pypdf>=6.15.0",
]

[tool.uv]
package = false
constraint-dependencies = [
  # Alembic and Uvicorn use Click. Keep its editor helper off the shell so a
  # crafted editor value cannot become a command.
  "click>=8.3.3",
  # Supabase requests HTTP/2 support through httpx. Reject duplicate Host
  # headers before an HTTP/2 request can be downgraded to HTTP/1.1.
  "h2>=4.4.1",
]

[tool.pytest.ini_options]
testpaths = ["alethical/tests"]
pythonpath = ["."]
