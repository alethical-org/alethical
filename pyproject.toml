[project]
name = "alethical"
version = "0.1.0"
description = "Alethical backend and ingestion system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5",
  "sqlalchemy>=2.0.51",
  "psycopg[binary]>=3.3.4",
  "pgvector>=0.5.0",
  "requests>=2.34.2",
  "fastapi>=0.140.9",
  "uvicorn>=0.51.0",
  "pydantic>=2.13.4",
  "pytest>=9.1.1",
  "httpx>=0.28.1",
  "pytest-asyncio>=1.4.0",
  "supabase>=2.31.0",
  "oban>=0.6.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["alethical/tests"]
pythonpath = ["."]
