# Watch our dependencies so a retirement or a known vulnerability shows up as a
# pull request instead of a warning nobody reads.
#
# Background, both halves found the same week (July 2026):
#   - Every workflow action was still asking for Node 20 months after GitHub
#     switched it off (#674). Nothing broke only because of a temporary
#     force-migration onto Node 24, and it was caught by hand.
#   - Turning Dependabot alerts on for the first time returned 70 open alerts
#     (#691), 21 of them backend. Nothing had ever been watching.
#
# This file's first version covered github-actions only, on the reasoning that
# Python and JS dependencies were "bumped deliberately." That reasoning was
# wrong: nothing was bumping them at all, which is how 70 alerts accumulated
# unseen. All three ecosystems are watched now (docs/philosophy.md principle 9,
# "Prevent, don't just fix" — an alert someone has to read is not prevention).
#
# Each ecosystem carries two groups, and the second one is easy to leave out.
# A `groups` block applies to *scheduled version updates only* unless it says
# otherwise, so the monthly sweep groups but alert-driven security updates
# still open one PR per advisory. That is what produced nine PRs in four
# minutes and got automatic security fixes switched off (#691). The
# `applies-to: security-updates` twin makes a batch of alerts arrive as one
# reviewable PR instead, and adding it is what allowed that setting to be
# turned back on (docs/operations/repo-and-service-settings.md, GitHub
# repository table). Deleting either twin silently restores the old
# one-PR-per-advisory behaviour, so keep them paired.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      workflow-actions:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      workflow-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    labels:
      - ci

  # astral-sh/setup-uv is pinned to an exact release in the workflows because
  # upstream stopped publishing floating major tags; Dependabot follows exact
  # tags, so that pin is covered here rather than left to go stale by hand.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    labels:
      - backend

  # Covers the pnpm workspace from the root lockfile. Note that most of the
  # July 2026 npm alerts were transitive under Expo's build tooling, which a
  # version update cannot reach directly — those clear when Expo itself moves.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    # Expo selects one tested set of Expo, React, React Native, and native
    # packages for each SDK. Dependabot compares each package in isolation and
    # mixed SDK 55 with SDK 57 in #1394. Leave routine version moves for these
    # packages to an intentional Expo SDK upgrade. Patch updates remain open
    # where Expo accepts a patch range. Security updates are still allowed
    # because update-types applies only to scheduled version updates.
    ignore:
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-safe-area-context"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native-screens"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native-svg"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-web"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      javascript-dependencies:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      javascript-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    labels:
      - frontend

  # Container images sit outside Python and JavaScript package files. Without
  # these 2 entries, their security and support updates stay invisible.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    groups:
      container-images:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      container-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    labels:
      - dependencies

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
    groups:
      compose-images:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      compose-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    labels:
      - dependencies
