name: Publish the Finance national FCC search
on:
  schedule:
    - cron: "41 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: national-fcc-search-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Release a new search file only when its inputs changed
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        # Reads the compact inventory pointer once its backfill covers every day through
        # the archive index (else the active archive release), the
        # census listing and the Minnesota identities first; when their digest equals
        # the active release's, it stops before restoring, building or uploading.
        # A build of the full inventory needs about 25 GB of scratch space at peak, more
        # than the runner's main disk keeps free, so it works on the larger /mnt disk.
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/fcc-search
          sudo chown "$(id -u):$(id -g)" /mnt/fcc-search
          mkdir -p /mnt/fcc-search/sqlite-tmp
          export SQLITE_TMPDIR=/mnt/fcc-search/sqlite-tmp TMPDIR=/mnt/fcc-search/sqlite-tmp
          df -h / /mnt
          uv run --no-sync python scripts/national_fcc_search.py release --work /mnt/fcc-search/work
