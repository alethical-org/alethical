name: Site metrics source health

# Read cached public totals. No model runs, private APIs, synthetic visits,
# searches, sign-ins, test events, vendor checks, or external notifications.
on:
  schedule:
    - cron: "43 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-metrics-source-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Test the checker with offline examples
        run: python -m unittest scripts.tests.test_check_site_metrics_health

      - name: Check public metric sources
        run: python scripts/check_site_metrics_health.py --summary "$GITHUB_STEP_SUMMARY"
