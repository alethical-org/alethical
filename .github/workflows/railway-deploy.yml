name: Deploy to Railway

on:
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check Railway token
        run: ': "${RAILWAY_TOKEN:?Missing RAILWAY_TOKEN secret}"'

      - name: Deploy production to Railway
        run: npx --yes @railway/cli up --ci --service alethical-api --environment production
