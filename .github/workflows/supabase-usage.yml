name: Supabase database efficiency

on:
  schedule:
    - cron: "53 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-efficiency
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require trusted main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.5
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: uv sync --frozen
      - name: Check forecast and counter arithmetic
        run: uv run pytest scripts/tests/test_supabase_usage_report.py -q
      - name: Sample read-only database counters
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PYTHONPATH: .
        run: uv run python scripts/supabase_usage_report.py --database-probe > supabase-database-efficiency.json
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: supabase-database-efficiency
          path: supabase-database-efficiency.json
          retention-days: 30
