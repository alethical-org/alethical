name: CI

# Do NOT add a `paths:` filter to `pull_request` below. The `changes`, `backend`,
# and `frontend` jobs are required status checks on `main`. Filtering at the
# workflow level would stop this workflow from running at all on unrelated PRs,
# so those checks would never report and every such PR would block forever. Filter
# per job instead — as `backend` and `frontend` already do via
# `dorny/paths-filter` — because a job skipped by `if:` reports `skipped`, which
# GitHub counts as a passing required check. `changes` also runs the always-needed
# documentation checks, so they share its one rounded runner minute.
#
# `merge_group:` is required for the merge queue (enabled Aug 17 2026): without it,
# these required checks never run on the queue's speculative commits, and every PR
# sits in the queue until it times out. `dorny/paths-filter` auto-detects the merge
# group's base/head commits, so `backend`/`frontend` path filtering works unchanged.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A newer PR commit makes the older test result irrelevant. Do not cancel main
# builds: those are release evidence, not superseded review work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # check_doc_sync.py needs a real merge base with the PR's base branch.
          # A shallow clone has none, and the guard would silently pass.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - ".github/workflows/ci.yml"
              - ".python-version"
              - "alembic.ini"
              - "alethical/**"
              # A backend test asserts on the content of docs: the docs-drift
              # guard's suite reads every doc's `describes:` comment, so a
              # docs-only edit can break a backend test. #921 declared
              # alethical/db/models.py on a doc and broke
              # test_code_no_doc_describes_is_ignored with CI green, because a
              # docs-only PR skipped this job.
              - "docs/**"
              - "pyproject.toml"
              - "scripts/**"
              - "uv.lock"
            frontend:
              - ".github/workflows/ci.yml"
              - "apps/frontend/**"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"

      # Free backstop for private-repo secret scanning. It checks only the new
      # commits in this push or PR and fails for a confirmed live credential or
      # a credential whose live check could not complete. Alethical has no Lob
      # account or code, and Lob's key shape collides with ordinary pytest names
      # (`test_` plus 35 characters), so exclude only that detector. Pin both the
      # action code and scanner image so a future upstream release cannot change CI.
      - name: Check new commits for live secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: --results=verified,unknown --fail-on-scan-errors --exclude-detectors=lob

      # Runs on every event: a broken document reference is usually introduced
      # by a docs-only or rules-only change, which the backend and frontend jobs
      # skip. Pure stdlib, so the Python setup above is the only dependency.
      - name: Check doc references resolve
        run: python scripts/check_doc_references.py
      - name: Check quoted doc claims still exist
        run: python scripts/check_doc_quotes.py
      # Rule 16 (.claude/rules/workflow.md): added doc lines state what is
      # true now, never narrate decision history. Diff-based -- it reads only
      # the lines a PR adds, so the existing corpus and kept evidence never
      # trip it. Needs the merge base, hence PR-only, like the doc-sync step.
      - name: Check new doc lines state the present
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          TIMELESS_BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          python scripts/check_timeless_docs.py
      # AGENTS.md deliberately repeats workflow.md rule 10's git prohibitions,
      # because only Claude Code auto-loads .claude/rules/ — every other agent
      # reads AGENTS.md alone. That makes the two copies drifting apart the real
      # risk, and nothing checked for it before this step.
      - name: Check shared-checkout git prohibitions stayed in sync
        run: python scripts/check_shared_checkout_rules_in_sync.py

      # A NUL byte makes git and grep treat a file as binary, hiding its code
      # from searches and diffs. This guard is cheap enough to always run.
      - name: Check no file carries a NUL byte
        run: python scripts/check_no_nul_bytes.py

      # A conflict block reached main inside a plain-English guide and sat there
      # for 7 days (#1683): no compiler, formatter or test reads Markdown, so
      # nothing noticed 2 contradicting accounts of the same screens.
      - name: Check no file carries a merge-conflict marker
        run: python scripts/check_no_merge_conflict_markers.py

      # docs/operations/jobs-and-scripts.md is the only place a job or a
      # command-line script is inventoried, and its counts went stale twice in a
      # week (#1869, then 57 real scripts against 55 stated). Its own sentence
      # says the list exists "so a new file cannot hide inside a total", so this
      # derives every count and both name lists from the repository instead.
      - name: Check the jobs and scripts page matches the repository
        run: python scripts/check_jobs_and_scripts_inventory.py

      # 20 candidates hold more than one campaign committee, and money moved
      # between a person's own committees is reported by both of them, so a
      # combined figure counts it twice -- by 100% for 2 of them (#1663). The
      # backend cannot build one; this is the frontend's half, and it runs on
      # every event because a frontend-only PR skips the backend job.
      - name: Check no surface adds a person's campaign committees together
        run: python scripts/check_no_cross_committee_total.py

      # Only meaningful on a PR: it compares against the merge base and reads
      # the PR body. It checks both docs that describe changed code and frozen
      # design-bundle edits. On a push to main there is no body, so skip it.
      - name: Check doc and design changes were explained
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          DOC_SYNC_BASE_REF: origin/${{ github.base_ref }}
          DOC_SYNC_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          python scripts/check_doc_sync.py

  backend:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: alethical
          POSTGRES_USER: alethical
          POSTGRES_PASSWORD: alethical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethical -d alethical"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://alethical:alethical@localhost:5432/alethical
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned to an exact release: setup-uv stopped publishing floating major
      # tags after v7, so this one is bumped by hand. prune-cache keeps the
      # smaller dependency cache that was the default through v8.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.5
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      # Guard against multiple Alembic heads: when two branches each add a
      # migration off the same parent, `alembic upgrade head` (incl. the prod
      # migrate-on-merge) fails. Catch it here at PR time — three such
      # collisions happened during #486 (#500/#508 vs #489) and only surfaced
      # in manual checks. DB-free (reads the migration scripts).
      - name: Check single migration head
        run: |
          heads=$(uv run alembic heads 2>/dev/null | grep -c '(head)')
          echo "alembic heads: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::Multiple Alembic heads — rebase your migration to chain after the current head so prod migrate-on-merge doesn't break."
            uv run alembic heads
            exit 1
          fi

      # Guard against the schema drifting away from the models again. Builds two
      # throwaway databases on the service above — one by `alembic upgrade head`,
      # one by `Base.metadata.create_all()` — and diffs their catalogs. A model
      # edit with no migration shows up here as a difference. This check could
      # not have worked before #100: while 0001 called create_all, the migration
      # path read models.py too, so the two sides agreed by construction and the
      # drift that reached production (39 differences, docs/operations/
      # production-database-schema-drift.md) was invisible to every gate we had.
      - name: Check schema drift
        run: uv run python scripts/check_schema_drift.py

      # Guard against imports that only work by accident: a package our code
      # imports but pyproject.toml never declares survives on some other
      # dependency happening to require it, then breaks when that dependency
      # stops. numpy did exactly this — undeclared, arriving via supabase, and
      # deleted by an unrelated bump (#693) that turned the whole suite red
      # (#701). DB-free (parses imports, reads pyproject.toml).
      - name: Check dependencies are declared
        run: uv run python3 scripts/check_declared_dependencies.py

      # Pin ruff: uvx resolves the latest release, so a new ruff (0.16.0 expanded
      # the default rule set) turned green CI red repo-wide with no code change.
      # Pin to a known-good version; bump deliberately when adopting new rules.
      - name: Lint backend
        run: uvx ruff@0.15.0 check alethical scripts

      - name: Format check backend
        run: uvx ruff@0.15.0 format --check alethical scripts

      # Pin ty like ruff (#614): uvx resolves the latest release, and ty is
      # pre-1.0 (changes fast), so an unpinned upgrade could break CI repo-wide
      # with no code change. Bump deliberately.
      - name: Type check backend
        run: uvx ty@0.0.72 check alethical/db

      - name: Test backend
        run: uv run pytest

  frontend:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      # Expo and React Native packages have to move as one tested set. A normal
      # package update can otherwise mix SDK releases and still install cleanly,
      # then fail only at type-check or build time (#1394).
      - name: Check Expo package compatibility
        run: pnpm run check:expo-packages

      # Security fixes can cross package major versions while preserving only
      # the narrow commands EAS CLI and Xcode use. Exercise those commands so a
      # future grouped dependency update cannot silently break native builds.
      - name: Check secured build-tool compatibility
        run: pnpm run check:build-tool-security

      - name: Type check frontend
        run: pnpm exec tsc --noEmit

      - name: Format check frontend
        run: pnpm exec prettier --check .

      # The type and format checks above cannot catch a wrong answer — they check
      # the code is spelled correctly, not that it does the right thing (#751).
      # Pure-logic tests only: no component, browser or visual tests, so this
      # needs no simulated DOM and stays a few hundred milliseconds.
      - name: Test frontend
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build
