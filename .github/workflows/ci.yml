name: CI

# Do NOT add a `paths:` filter to `pull_request` below. The `changes`,
# `doc-references`, `backend`, and `frontend` jobs are required status checks on
# `main`. Filtering at the workflow level would stop this workflow from running at
# all on unrelated PRs, so those checks would never report and every such PR would
# block forever. Filter per job instead — as `backend` and `frontend` already do
# via `dorny/paths-filter` — because a job skipped by `if:` reports `skipped`,
# which GitHub counts as a passing required check.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - ".github/workflows/ci.yml"
              - ".python-version"
              - "alembic.ini"
              - "alethical/**"
              # A backend test asserts on the content of docs: the docs-drift
              # guard's suite reads every doc's `describes:` comment, so a
              # docs-only edit can break a backend test. #921 declared
              # alethical/db/models.py on a doc and broke
              # test_code_no_doc_describes_is_ignored with CI green, because a
              # docs-only PR skipped this job.
              - "docs/**"
              - "pyproject.toml"
              - "scripts/**"
              - "uv.lock"
            frontend:
              - ".github/workflows/ci.yml"
              - "apps/frontend/**"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"

  backend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: alethical
          POSTGRES_USER: alethical
          POSTGRES_PASSWORD: alethical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethical -d alethical"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://alethical:alethical@localhost:5432/alethical
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned to an exact release: setup-uv stopped publishing floating major
      # tags after v7, so this one is bumped by hand. prune-cache keeps the
      # smaller dependency cache that was the default through v8.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      # Guard against multiple Alembic heads: when two branches each add a
      # migration off the same parent, `alembic upgrade head` (incl. the prod
      # migrate-on-merge) fails. Catch it here at PR time — three such
      # collisions happened during #486 (#500/#508 vs #489) and only surfaced
      # in manual checks. DB-free (reads the migration scripts).
      - name: Check single migration head
        run: |
          heads=$(uv run alembic heads 2>/dev/null | grep -c '(head)')
          echo "alembic heads: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::Multiple Alembic heads — rebase your migration to chain after the current head so prod migrate-on-merge doesn't break."
            uv run alembic heads
            exit 1
          fi

      # Guard against imports that only work by accident: a package our code
      # imports but pyproject.toml never declares survives on some other
      # dependency happening to require it, then breaks when that dependency
      # stops. numpy did exactly this — undeclared, arriving via supabase, and
      # deleted by an unrelated bump (#693) that turned the whole suite red
      # (#701). DB-free (parses imports, reads pyproject.toml).
      - name: Check dependencies are declared
        run: uv run python3 scripts/check_declared_dependencies.py

      # Pin ruff: uvx resolves the latest release, so a new ruff (0.16.0 expanded
      # the default rule set) turned green CI red repo-wide with no code change.
      # Pin to a known-good version; bump deliberately when adopting new rules.
      - name: Lint backend
        run: uvx ruff@0.15.0 check alethical scripts

      - name: Format check backend
        run: uvx ruff@0.15.0 format --check alethical scripts

      # Pin ty like ruff (#614): uvx resolves the latest release, and ty is
      # pre-1.0 (changes fast), so an unpinned upgrade could break CI repo-wide
      # with no code change. Bump deliberately.
      - name: Type check backend
        run: uvx ty@0.0.63 check alethical/db

      - name: Test backend
        run: uv run pytest

  frontend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Type check frontend
        run: pnpm exec tsc --noEmit

      - name: Format check frontend
        run: pnpm exec prettier --check .

      # The type and format checks above cannot catch a wrong answer — they check
      # the code is spelled correctly, not that it does the right thing (#751).
      # Pure-logic tests only: no component, browser or visual tests, so this
      # needs no simulated DOM and stays a few hundred milliseconds.
      - name: Test frontend
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

  # Runs on every PR with no path filter — a broken doc reference is usually
  # introduced by a docs-only or rules-only change, which the backend and
  # frontend jobs above skip. That gap let a rename (#652) merge a dead index
  # link. Pure stdlib, so no dependency install is needed.
  doc-references:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history: check_doc_sync.py needs a real merge base with the PR's
          # base branch. A shallow clone has none, and the guard would then find
          # no changed files and pass every PR silently.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check doc references resolve
        run: python scripts/check_doc_references.py

      # Cheap and unconditional: a NUL byte anywhere makes git and grep treat that
      # whole file as binary, so its code stops being searchable and its diffs stop
      # being reviewable. One shipped in #866 and every other gate passed it.
      - name: Check no file carries a NUL byte
        run: python scripts/check_no_nul_bytes.py

      # Only meaningful on a PR: it compares against the merge base and reads the
      # PR body. On a push to main there is no body to read, so it is skipped
      # rather than failing every direct push.
      - name: Check docs describing changed code were looked at
        if: github.event_name == 'pull_request'
        env:
          DOC_SYNC_BASE_REF: origin/${{ github.base_ref }}
          DOC_SYNC_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          python scripts/check_doc_sync.py
