name: CI

# Do NOT add a `paths:` filter to `pull_request` below. The `changes`, `backend`,
# and `frontend` jobs are required status checks on `main`. Filtering at the
# workflow level would stop this workflow from running at all on unrelated PRs,
# so those checks would never report and every such PR would block forever. Filter
# per job instead — the `select` job runs `dorny/paths-filter` and `backend` and
# `frontend` read its answer — because a job skipped by `if:` reports `skipped`,
# which GitHub counts as a passing required check.
#
# `select` is its own small first job so the test jobs start as soon as the answer
# exists, not after `changes` finishes its document and security checks. A job
# skipped because a job it needs failed "may not block merging" (GitHub, "Handling
# skipped but required checks"), so a failed `select` would otherwise leave
# `backend` and `frontend` skipped and the pull request mergeable with no tests
# run. The required `changes` job therefore fails whenever `select` did not
# succeed or gave no answer.
#
# `merge_group:` is required for the merge queue (enabled Aug 17 2026): without it,
# these required checks never run on the queue's speculative commits, and every PR
# sits in the queue until it times out. `dorny/paths-filter` auto-detects the merge
# group's base/head commits, so `backend`/`frontend` path filtering works unchanged.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A newer PR commit makes the older test result irrelevant. Do not cancel main
# builds: those are release evidence, not superseded review work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Pushes and merge groups compare against their base commit with git
          # commands, so the base must be present in the clone.
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Shared with local upload checks; JSON is also valid YAML.
          filters: .github/check-paths.json

  changes:
    needs: select
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a completed path selection
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          SELECTED_BACKEND: ${{ needs.select.outputs.backend }}
          SELECTED_FRONTEND: ${{ needs.select.outputs.frontend }}
        run: |
          if [ "$SELECT_RESULT" != success ]; then
            echo "::error::Path selection ended as '$SELECT_RESULT', so the backend and frontend checks may have been skipped without running."
            exit 1
          fi
          for answer in "$SELECTED_BACKEND" "$SELECTED_FRONTEND"; do
            case "$answer" in
              true|false) ;;
              *) echo "::error::Path selection gave no answer for a test suite."; exit 1 ;;
            esac
          done

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # check_doc_sync.py needs a real merge base with the PR's base branch.
          # A shallow clone has none, and the guard would silently pass.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Security findings must block every release, including dependency changes
      # that do not select an app test suite. Keep this in the required changes
      # job, which always runs on pull requests and merge-queue commits.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.5
          enable-cache: true
          prune-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check all locked Python and JavaScript packages for security problems
        run: >
          python scripts/check_technology_health.py --security-only
          --report "$GITHUB_STEP_SUMMARY"

      # Free backstop for private-repo secret scanning. It checks only the new
      # commits in this push, PR or merge group and fails for a live credential or
      # a credential whose live check could not complete. Alethical has no Lob
      # account or code, and Lob's key shape collides with ordinary pytest names
      # (`test_` plus 35 characters), so exclude only that detector. Pin both the
      # action code and scanner image so a future upstream release cannot change CI.
      - name: Check new commits for live secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          # The pinned action detects push/PR bounds, but not merge_group bounds.
          # Empty inputs preserve its existing behavior for every other event.
          base: ${{ github.event.merge_group.base_sha || '' }}
          head: ${{ github.event.merge_group.head_sha || '' }}
          extra_args: --results=verified,unknown --fail-on-scan-errors --exclude-detectors=lob

      # Runs on every event: a broken document reference is usually introduced
      # by a docs-only or rules-only change, which the backend and frontend jobs
      # skip. Pure stdlib, so the Python setup above is the only dependency.
      - name: Check document links, indexes, and quoted claims
        run: python scripts/local_checks.py quick-docs
      - name: Test document structure checks without database or network
        run: python -m unittest discover -s scripts/tests -p 'test_doc_structure.py'
      - name: Test address-copy capacity and rollback without service credentials
        run: python -m unittest scripts.tests.test_address_copy_capacity scripts.tests.test_address_copy_control
      - name: Test public search and failure evidence without service access
        run: >-
          python -m unittest
          scripts.tests.test_check_public_search_health
          scripts.tests.test_collect_page_failure_health
          scripts.tests.test_check_page_failure_coverage
      - name: Retain reviewed failure evidence and test history collection
        run: |
          python scripts/review_repeat_failures.py check --review docs/operations/repeat-failure-cases.json --root .
          python -m unittest discover -s scripts/tests -p 'test_review_repeat_failures.py'
          python -m unittest discover -s scripts/tests -p 'test_repeat_failure_runs.py'
          node --test apps/frontend/scripts/test-address-recovery-local.mjs
      - name: Test local upload selection without database or network
        run: python -m unittest discover -s scripts/tests -p 'test_local_checks.py'
      - name: Check every frontend command still runs after the job split
        run: python -m unittest discover -s scripts/tests -p 'test_frontend_ci_commands.py'
      - name: Test working-folder backup and cleanup without production data
        run: python -m unittest discover -s scripts/tests -p 'test_worktree_*.py'
      # Rule 16 (.claude/rules/workflow.md): added doc lines state what is
      # true now, never narrate decision history. Diff-based -- it reads only
      # the lines a PR adds, so the existing corpus and kept evidence never
      # trip it. Needs the merge base, hence PR-only, like the doc-sync step.
      - name: Check new doc lines state the present
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          TIMELESS_BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          python scripts/check_timeless_docs.py
      # AGENTS.md deliberately repeats workflow.md rule 10's git prohibitions,
      # because only Claude Code auto-loads .claude/rules/ — every other agent
      # reads AGENTS.md alone. That makes the two copies drifting apart the real
      # risk, and nothing checked for it before this step.
      - name: Check shared-checkout git prohibitions stayed in sync
        run: python scripts/check_shared_checkout_rules_in_sync.py

      # A NUL byte makes git and grep treat a file as binary, hiding its code
      # from searches and diffs. This guard is cheap enough to always run.
      - name: Check no file carries a NUL byte
        run: python scripts/check_no_nul_bytes.py

      # A conflict block reached main inside a plain-English guide and sat there
      # for 7 days (#1683): no compiler, formatter or test reads Markdown, so
      # nothing noticed 2 contradicting accounts of the same screens.
      - name: Check no file carries a merge-conflict marker
        run: python scripts/check_no_merge_conflict_markers.py

      # docs/operations/jobs-and-scripts.md is the only place a job or a
      # command-line script is inventoried, and its counts went stale twice in a
      # week (#1869, then 57 real scripts against 55 stated). Its own sentence
      # says the list exists "so a new file cannot hide inside a total", so this
      # derives every count and both name lists from the repository instead.
      - name: Check the jobs and scripts page matches the repository
        run: python scripts/check_jobs_and_scripts_inventory.py

      # 20 candidates hold more than one campaign committee, and money moved
      # between a person's own committees is reported by both of them, so a
      # combined figure counts it twice -- by 100% for 2 of them (#1663). The
      # backend cannot build one; this is the frontend's half, and it runs on
      # every event because a frontend-only PR skips the backend job.
      - name: Check no surface adds a person's campaign committees together
        run: python scripts/check_no_cross_committee_total.py

  backend:
    needs: select
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.select.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://alethical:alethical@localhost:5432/alethical
    steps:
      # Pull the same public image directly from Google's cache. Docker's daemon
      # mirror fallback still reached Docker Hub's shared pull limit on CI.
      - name: Start the temporary test database through Google's public cache
        run: |
          set -euo pipefail
          ci_database_image=mirror.gcr.io/pgvector/pgvector:pg17
          if ! docker pull "$ci_database_image"; then
            ci_database_image=pgvector/pgvector:pg17
            docker pull "$ci_database_image"
          fi
          docker run --detach --rm --name alethical-ci-postgres \
            -e POSTGRES_DB=alethical -e POSTGRES_USER=alethical \
            -e POSTGRES_PASSWORD=alethical -p 5432:5432 \
            --health-cmd "pg_isready -U alethical -d alethical" \
            --health-interval 5s --health-timeout 5s --health-retries 20 \
            "$ci_database_image"
          for attempt in $(seq 1 30); do
            if test "$(docker inspect --format '{{.State.Health.Status}}' alethical-ci-postgres)" = healthy; then
              exit 0
            fi
            sleep 5
          done
          echo 'The temporary test database did not become ready'
          exit 1
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned to an exact release: setup-uv stopped publishing floating major
      # tags after v7, so this one is bumped by hand. prune-cache keeps the
      # smaller dependency cache that was the default through v8.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.5
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install PDF renderer used by TV ad record tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          pdftoppm -v

      # Guard against multiple Alembic heads: when two branches each add a
      # migration off the same parent, `alembic upgrade head` (incl. the prod
      # migrate-on-merge) fails. Catch it here at PR time — three such
      # collisions happened during #486 (#500/#508 vs #489) and only surfaced
      # in manual checks. DB-free (reads the migration scripts).
      - name: Check single migration head
        run: |
          heads=$(uv run alembic heads 2>/dev/null | grep -c '(head)')
          echo "alembic heads: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::Multiple Alembic heads — rebase your migration to chain after the current head so prod migrate-on-merge doesn't break."
            uv run alembic heads
            exit 1
          fi

      # Guard against the schema drifting away from the models again. Builds two
      # throwaway databases on the service above — one by `alembic upgrade head`,
      # one by `Base.metadata.create_all()` — and diffs their catalogs. A model
      # edit with no migration shows up here as a difference. This check could
      # not have worked before #100: while 0001 called create_all, the migration
      # path read models.py too, so the two sides agreed by construction and the
      # drift that reached production (39 differences, docs/operations/
      # production-database-schema-drift.md) was invisible to every gate we had.
      - name: Check schema drift
        run: uv run python scripts/check_schema_drift.py

      # Guard against imports that only work by accident: a package our code
      # imports but pyproject.toml never declares survives on some other
      # dependency happening to require it, then breaks when that dependency
      # stops. numpy did exactly this — undeclared, arriving via supabase, and
      # deleted by an unrelated bump (#693) that turned the whole suite red
      # (#701). DB-free (parses imports, reads pyproject.toml).
      - name: Check dependencies are declared
        run: uv run python3 scripts/check_declared_dependencies.py

      # Pin ruff: uvx resolves the latest release, so a new ruff (0.16.0 expanded
      # the default rule set) turned green CI red repo-wide with no code change.
      # Pin to a known-good version; bump deliberately when adopting new rules.
      - name: Lint backend
        run: uvx ruff@0.15.0 check alethical scripts

      - name: Format check backend
        run: uvx ruff@0.15.0 format --check alethical scripts

      # Pin ty like ruff (#614): uvx resolves the latest release, and ty is
      # pre-1.0 (changes fast), so an unpinned upgrade could break CI repo-wide
      # with no code change. Bump deliberately.
      - name: Type check backend
        run: uvx ty@0.0.72 check alethical/db

      - name: Test backend
        run: |
          uv run python -m unittest discover -s scripts/tests -p 'test_manual_test_database.py'
          uv run python -m unittest discover -s scripts/tests -p 'test_repeat_failure_runs_pytest.py'
          uv run --frozen python scripts/repeat_failure_runs.py run --scope backend --output .tmp/prevention-backend
          uv run --frozen python scripts/repeat_failure_runs.py check --output .tmp/prevention-backend --commit "$GITHUB_SHA"

      - name: Retain named prevention results even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prevention-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/prevention-backend/receipt.json
            .tmp/prevention-backend/pytest.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Stop this job's temporary test database
        if: always()
        run: docker stop alethical-ci-postgres || true

  frontend-checks:
    needs: select
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.select.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Test staged-edit preservation and hook installation
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s scripts/tests -p 'test_staged_checks.py'

      # Expo and React Native packages have to move as one tested set. A normal
      # package update can otherwise mix SDK releases and still install cleanly,
      # then fail only at type-check or build time (#1394).
      - name: Check Expo package compatibility
        run: pnpm run check:expo-packages

      # Keep the website's patched build and link tools working.
      - name: Check secured web build-tool compatibility
        run: pnpm run check:build-tool-security

      - name: Check website brand assets
        run: pnpm run brand:check

      - name: Type check frontend
        run: pnpm exec tsc --noEmit

      - name: Format check frontend
        working-directory: ${{ github.workspace }}
        run: node scripts/format_frontend.mjs --check

      # The type and format checks above cannot catch a wrong answer — they check
      # the code is spelled correctly, not that it does the right thing (#751).
      # Run the complete saved suite, including logic and rendered snapshots.
      # The built reader paths below supplement these component tests.
      - name: Check named page returns
        run: node --test scripts/test-return-links.mjs && node scripts/check-return-links.mjs

      - name: Test frontend
        run: pnpm run test

  frontend-browser:
    needs: select
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.select.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record pending built-reader evidence before setup
        env:
          CHECKED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY_EVIDENCE'
          import json, os
          from pathlib import Path
          Path("reader-completion-results.json").write_text(json.dumps({
              "schema_version": 1, "phase": "premerge-setup-pending", "passed": False,
              "checked_commit": os.environ["CHECKED_COMMIT"],
              "checks": [], "failure": "browser-checks-not-started"
          }) + "\n")
          PY_EVIDENCE

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          EXPO_PUBLIC_API_URL: https://api.alethical.com
          ALETHICAL_COMMIT_SHA: ${{ github.sha }}
        run: pnpm run build

      - name: Test reader-check privacy and target guards
        run: node --test scripts/test-reader-completion-policy.mjs scripts/test-reader-completion-money.mjs

      - name: Name the browser cache for this runner image and Playwright version
        id: browser-cache
        run: |
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Chromium and its system packages (fonts, libnss3) are the same on every run
      # until the runner image or Playwright changes. Ubuntu's package mirror has
      # stalled the install past its 10-minute limit; a cached copy needs no mirror.
      - name: Restore Chromium and its system packages from earlier runs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/browser-apt-archives/*.deb
          key: browser-${{ steps.browser-cache.outputs.image }}-playwright-${{ steps.browser-cache.outputs.playwright }}
          restore-keys: |
            browser-${{ steps.browser-cache.outputs.image }}-
            browser-

      - name: Bound browser dependency downloads
        uses: ./.github/actions/prepare-browser-install

      - name: Install Chromium for reader checks
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise the built public reader paths with fixed sample records
        run: |
          node scripts/serve-reader-check-build.mjs &
          reader_server_pid=$!
          trap 'kill "$reader_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/reader-completion-checks.mjs \
            --base-url http://127.0.0.1:4173 --fixtures \
            --checked-commit "$GITHUB_SHA" --expected-commit "$GITHUB_SHA" \
            --output reader-completion-results.json
          BASE_URL=http://127.0.0.1:4173 node scripts/check-address-suggestion-layering.mjs
          BASE_URL=http://127.0.0.1:4173 node scripts/check-address-recovery.mjs --skip-recovery --only 'address controls'
          node scripts/check-candidate-return.mjs http://127.0.0.1:4173
          node scripts/check-contextual-return.mjs http://127.0.0.1:4173
          node scripts/check-candidate-location.mjs http://127.0.0.1:4173 /tmp/candidate-location-check --chromium
          E2E_STATIC_BUILD=1 E2E_BASE_URL=http://127.0.0.1:4173 pnpm exec playwright test \
            e2e/services-print.spec.ts e2e/candidate-record-status.spec.ts \
            e2e/tv-ad-records.spec.ts e2e/event-cards.spec.ts e2e/event-share.spec.ts \
            e2e/footer.spec.ts e2e/contact-side-alignment.spec.ts e2e/home-hero-social.spec.ts \
            e2e/home-hero-still.spec.ts \
            --project=chromium
          # These failures must reach the money assertions. A crashed browser,
          # wrong release, or earlier navigation failure is not a successful test.
          for money_failure in unavailable wrong-amount missing-as-zero; do
            if node scripts/reader-completion-checks.mjs \
              --base-url http://127.0.0.1:4173 --fixtures \
              --fixture-money-failure "$money_failure" \
              --checked-commit "$GITHUB_SHA" --expected-commit "$GITHUB_SHA" \
              --output "reader-money-negative-$money_failure.json"; then
              echo 'A deliberately broken money response passed the reader checks'
              exit 1
            fi
            MONEY_FAILURE="$money_failure" python3 - <<'PY_MONEY'
          import json, os
          mode = os.environ["MONEY_FAILURE"]
          with open(f"reader-money-negative-{mode}.json") as source:
              report = json.load(source)
          expected = (
              "money-fixture-separate-committees-missing-versus-zero"
              if mode == "missing-as-zero"
              else "money-fixture-official-amounts-period-and-source"
          )
          failures = [check for check in report["checks"] if check["passed"] is False]
          assert report["passed"] is False and report["blocked_requests"] == 0
          assert report["phase"] == "premerge-fixtures" and report["release_match"] == "exact"
          assert len(failures) == 1 and failures[0]["name"] == expected
          assert failures[0]["failure"] == "reader-expectation-not-met"
          assert any(check["name"] == "money-lane-opens-legislator-money-tab"
                     and check["passed"] is True for check in report["checks"])
          print(f"Deliberately broken money response rejected: {mode}")
          PY_MONEY
          done

          pnpm exec playwright test --config playwright.replay-startup.config.ts

      - name: Retain reader-check evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: built-reader-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/frontend/reader-completion-results.json
            apps/frontend/test-results/**/*.pdf
            apps/frontend/reader-money-negative-*.json
          if-no-files-found: warn
          retention-days: 30

  # The required `frontend` check. Type check, unit tests and the build-plus-browser
  # walk run side by side in the 2 jobs above; this job turns their results into 1
  # answer. A job skipped after a failed prerequisite "may not block merging", so
  # this job runs always and passes only when both ran and passed, or when the path
  # selection said the frontend was not needed and both were skipped.
  frontend:
    needs: [select, frontend-checks, frontend-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every frontend job to pass when the frontend was selected
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          SELECTED: ${{ github.event_name == 'workflow_dispatch' || needs.select.outputs.frontend == 'true' }}
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          BROWSER_RESULT: ${{ needs.frontend-browser.result }}
        run: |
          echo "select=$SELECT_RESULT selected=$SELECTED checks=$CHECKS_RESULT browser=$BROWSER_RESULT"
          if [ "$SELECT_RESULT" != success ]; then
            echo "::error::Path selection ended as '$SELECT_RESULT'."
            exit 1
          fi
          if [ "$SELECTED" = true ]; then
            expected=success
          else
            expected=skipped
          fi
          if [ "$CHECKS_RESULT" != "$expected" ] || [ "$BROWSER_RESULT" != "$expected" ]; then
            echo "::error::Frontend jobs should both be '$expected'; got checks '$CHECKS_RESULT' and browser '$BROWSER_RESULT'."
            exit 1
          fi
