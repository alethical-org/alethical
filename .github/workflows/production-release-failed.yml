name: Production release failed

# A merge that does not deploy is a merge no reader ever sees, and nothing in this
# repository said so ([issue 2052](https://github.com/alethical-org/alethical/issues/2052)).
#
# On 8 Sep 2026 the website's production build failed on 4 consecutive merges and
# production served the 02:56 release until 03:59. Every one of those 4 pull
# requests was green, the merge queue merged all 4, and the failure existed only in
# Vercel's own build log and the GitHub deployments list. It was found by a person
# happening to look, an hour in.
#
# WHY A CHECK ON THE PULL REQUEST COULD NOT HAVE CAUGHT IT. The 3 required checks
# run a GitHub runner's build, and the build that failed was Vercel's, of the same
# commit, producing 542 more bytes. So the only place this is visible is after the
# merge, which is exactly why it needs its own watch rather than another check.
#
# WHY AN ISSUE AND NOT ONLY A RED WORKFLOW RUN. A red run in the Actions tab is
# something a person has to go and look at, and the whole defect here was nobody
# looking. An issue reaches the board and the maintainer's notifications, so the
# issue is the alarm. The run goes red as well, for the reason under
# "A GREEN RUN IS NOT A QUIET WATCH" below.
#
# IT WATCHES A RED RELEASE, AND ITS SIBLING WATCHES AN ABSENT ONE. A production
# release that never starts produces no deployment and no status, so nothing here
# can see it: on 8 Sep 2026 a merged website change sat unbuilt for 29 minutes
# with every check green and this job reporting `skipped`
# ([issue 2075](https://github.com/alethical-org/alethical/issues/2075)).
# `.github/workflows/production-release-missing.yml` covers that shape, by reading
# which commit the served page says it was built from. Keep the 2 separate: this
# one is event-driven and answers in seconds, and that one has to wait for a
# release that may never come.
#
# Deliberately narrow, so it cannot cry wolf:
#
#   - Production only. A failed PREVIEW deployment ships nothing to anybody and
#     failed 6 times that same night for its own reasons.
#   - One issue, reused. A run of consecutive failures comments on the open issue
#     rather than opening a second one, which is what the 8 Sep incident would have
#     produced 4 of.
#   - It closes its own issue when a production release next succeeds, so a resolved
#     outage does not sit on the board. That is the half the 8 Sep write-up had to
#     be told to do by hand.
#
# A GREEN RUN IS NOT A QUIET WATCH. On 18 Sep 2026 production builds failed 3
# times in a row and this workflow did exactly its job: it opened
# [issue 2287](https://github.com/alethical-org/alethical/issues/2287) at 17:26:49
# on the first failure, commented on the second at 17:34:00 and the third at
# 18:05:46, and closed itself at 21:11:00 when a release succeeded. Its sibling
# opened [issue 2288](https://github.com/alethical-org/alethical/issues/2288) 2
# minutes later. All 3 runs still finished GREEN, because writing the issue was
# their success, and a later reading of the Actions tab took those green ticks for
# silence and filed
# [issue 2291](https://github.com/alethical-org/alethical/issues/2291) saying
# neither watch had fired. So the run now goes RED after it writes the issue. The
# issue is still the alarm; the red run only stops the Actions tab from reporting
# the opposite of what happened.
#
# AND IT SAYS HOW MANY IN A ROW. "Still failing, now on `503914be`" reads the same
# on the first repeat as on the tenth, and 3 in a row is a different thing from 1:
# a flake retries away, a run means something in the change set only fails in the
# hosted build, which here was the first-download size limit. The count comes from
# the issue's own comments, so it needs no state anywhere else.
#
# AND IT BELONGS HERE RATHER THAN IN A WORKFLOW OF ITS OWN. Counting a run of
# failures needs 2 things this job already holds: every production deployment
# event, and the 1 issue those failures share. A separate workflow would need its
# own copy of both, and 2 jobs writing the same issue is the race the concurrency
# group above exists to prevent.
#
# Costs nothing per run: one event, a few API calls on a public repository.

on:
  deployment_status:

concurrency:
  # Never two of these racing over the same issue. Not cancel-in-progress: a
  # success arriving while a failure is still being written must not drop either.
  group: production-release-failed
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Say when a merge stops reaching readers
    # `Production` is the website. The repository also has an environment named
    # `alethical / production`, which is a different thing and is not what a reader
    # gets, and reading the 2 as one is how the 8 Sep incident was first mis-read as
    # already recovered.
    if: github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STATE: ${{ github.event.deployment_status.state }}
      SHA: ${{ github.event.deployment.sha }}
      LOG_URL: ${{ github.event.deployment_status.log_url }}
      TITLE: A merge is not reaching readers, because the production release failed
    steps:
      - name: Open or update the issue on a failure, close it on a success
        run: |
          set -euo pipefail

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')

          case "$STATE" in
            failure|error)
              short="${SHA:0:8}"
              # How many production releases have failed in a row, counted from
              # the open issue: 1 for the issue itself, 1 per repeat comment
              # already on it, and 1 for this failure.
              in_a_row=1
              if [ -n "$existing" ]; then
                repeats=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" \
                  --json comments \
                  --jq '[.comments[] | select(.body | startswith("Still failing"))] | length') || repeats=""
                # A count nobody could read must not take the step down with it:
                # the alarm matters more than the number on it.
                case "$repeats" in ''|*[!0-9]*) repeats=0 ;; esac
                in_a_row=$(( repeats + 2 ))
              fi
              body=$(printf '%s\n' \
                "**Net:** Commit \`$short\` merged and its production release failed, so what readers get is still the previous release. Every later merge is stranded behind it until this clears." \
                "" \
                "Opened automatically by \`.github/workflows/production-release-failed.yml\`, because 4 merges once sat unshipped for 50 minutes with nothing anywhere saying so ([issue 2052](https://github.com/alethical-org/alethical/issues/2052))." \
                "" \
                "### What to do" \
                "" \
                "1. Read the failed build's log: $LOG_URL" \
                "2. The 3 required checks cannot have caught this. They build on a GitHub runner, and the build that failed is Vercel's own, which for the same commit produces about 542 more bytes in \`index-*.js\`. A first-load size failure is therefore invisible until this point." \
                "3. Judge what readers currently get by the \`Production\` environment's own deployment state, not by the \`Vercel\` commit status, which does not say which environment ran." \
                "" \
                "### Two things that will mislead you here" \
                "" \
                "- **An automated fetch's status code is not evidence about what readers see.** Vercel's bot protection answers repeated command-line requests with HTTP 403 and a challenge page, whatever user agent they carry, and it lifts after a pause. A real browser passes throughout. Open the address in a browser." \
                "- **A successful deployment in the \`alethical / production\` environment does not mean the website shipped.** That is a separate environment." \
                "" \
                "This issue closes itself when a production release next succeeds.")
              if [ -n "$existing" ]; then
                run_note=""
                if [ "$in_a_row" -ge 3 ]; then
                  run_note=$(printf '%s' " $in_a_row production releases in a row have now failed, which is a block rather than a flake: something in the merged changes fails only in the hosted build, and the first-download size limit in \`apps/frontend/scripts/check-first-load-budget.mjs\` is the one that has done this here before. Every merge since the last success is stranded behind it.")
                fi
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                  --body "Still failing, now on \`$short\`, failure $in_a_row in a row.${run_note} Build log: $LOG_URL"
              else
                gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "🚨 $TITLE" --label frontend --body "$body"
              fi
              {
                echo "## 🚨 The production release of \`$short\` failed"
                echo
                echo "Failure $in_a_row in a row. What readers get is still the previous release."
                echo "Build log: $LOG_URL"
                echo
                echo "An issue carrying this is open on the board. This run is red so the Actions"
                echo "tab cannot read as quiet while that issue is open."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=The production release failed::Commit $short did not reach readers; failure $in_a_row in a row."
              exit 1
              ;;
            success)
              if [ -n "$existing" ]; then
                gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed \
                  --comment "Releases are reaching readers again: the production release of \`${SHA:0:8}\` succeeded. Closed automatically. Whatever caused the failures is worth a look if it was not already fixed deliberately."
              fi
              ;;
            *)
              echo "Nothing to do for state '$STATE'."
              ;;
          esac
