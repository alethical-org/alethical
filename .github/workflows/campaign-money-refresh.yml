name: Refresh campaign money from the Board

# Keeps Alethical's campaign-money pages within a day of Minnesota's Campaign Finance
# Board. Before this existed nothing refreshed them on a schedule, and they sat 3 to 6
# weeks behind (https://github.com/alethical-org/alethical/issues/2344, D3).
#
# Each run, in this order:
#   1. takes 1 run-wide lock in the database, shared with hand-started and laptop
#      runs, so 2 starts at the same minute produce 1 run;
#   2. re-runs any money re-check left unfinished last time;
#   3. reads the Board's 6 small lists (3 registered-filer lists, 3 current-report
#      lists) and, on any change of content, or weekly regardless, refreshes the
#      official totals for EVERY supported year (a totals publication replaces the
#      whole set, so a 2-year run would erase 2022 to 2023);
#   4. downloads the 3 payment files (about 162 MB; they serve no size, date or change
#      marker, so a download is the only change detector) and publishes when every
#      check passes;
#   5. after any publish, clears the saved pages, runs both money re-checks, and
#      clears again once their verdicts are live.
# A quarantine leaves the previous set live, keeps the bytes and the printed reasons,
# exits non-zero, and the last step opens or updates an issue.
#
# Freshness, stated honestly: payments are checked daily; the totals are refreshed
# when a list changes and weekly.
#
# 15:30 UTC is 10:30 a.m. Central in summer and 9:30 in winter: after 8 a.m. Central,
# which is when Minnesota Statutes 10A.20 subd. 1b makes a report public the day
# after it is due. Every other daily slot in this repo (09:00, 11:00, 12:00, 13:00,
# 14:00, 16:00) and the Monday 15:00 link re-check are left alone.
#
# Free: public downloads from cfb.mn.gov, one database, no paid API.

on:
  workflow_dispatch:
    inputs:
      force_totals:
        description: "Refresh the official totals today even if no list changed"
        type: boolean
        default: false
      prove_alerting:
        description: "Exit 1 on purpose to prove the issue-filing step, touching nothing"
        type: boolean
        default: false
  schedule:
    - cron: "30 15 * * *"

concurrency:
  group: campaign-money-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      issues: write
    env:
      ALETHICAL_DATABASE_TARGET: production
      SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_STORAGE_S3_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_S3_ENDPOINT }}
      SUPABASE_STORAGE_S3_REGION: ${{ secrets.SUPABASE_STORAGE_S3_REGION }}
      SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
      SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
      # Clearing saved pages (#1979) is armed only when all 3 are set. Unset, the run
      # prints NOT ARMED and what it would have cleared, and still succeeds.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ALETHICAL_CLEAR_SAVED_ANSWERS: "on"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.5
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check the secrets are set
        shell: bash
        run: |
          missing=()
          for name in SUPABASE_PROJECT_URL SUPABASE_DB_PASSWORD \
                      SUPABASE_STORAGE_S3_ENDPOINT SUPABASE_STORAGE_S3_REGION \
                      SUPABASE_STORAGE_S3_ACCESS_KEY_ID SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Not set as repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      # shell: bash so the pipe fails when the script does (GitHub's default has no
      # pipefail); PYTHONPATH=. so `import alethical` resolves from scripts/.
      - name: Refresh
        shell: bash
        run: |
          flags=()
          if [ "${{ inputs.force_totals }}" = "true" ]; then flags+=(--force-totals); fi
          if [ "${{ inputs.prove_alerting }}" = "true" ]; then flags+=(--prove-alerting); fi
          PYTHONPATH=. uv run python scripts/refresh_campaign_finance.py \
            --target production "${flags[@]}" 2>&1 | tee refresh-report.txt

      - name: Open or update an issue when the refresh did not finish
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The daily campaign-money refresh did not finish"
          report=$(tail -c 60000 refresh-report.txt 2>/dev/null || echo "(no report was written)")
          body=$(printf 'Net: today'"'"'s refresh of Alethical'"'"'s campaign-money records from Minnesota'"'"'s Campaign Finance Board stopped before every step finished. The previous set is still live and nothing wrong was published; what did not land is named below, and a person decides whether it is a bad download, a known source disagreement, or a real change to publish under a named exception (see issue 2344, D2).\n\n```\n%s\n```\n\nRun: %s. Auto-filed by `.github/workflows/campaign-money-refresh.yml`; the next scheduled run retries on its own.' "$report" "$RUN_URL")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still not finishing as of this run — $RUN_URL"$'\n\n```\n'"$(tail -c 20000 refresh-report.txt)"$'\n```'
          else
            gh issue create --title "🚨 $title" --label backend --body "$body"
          fi
