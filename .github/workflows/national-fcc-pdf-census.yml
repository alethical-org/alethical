name: Check national FCC filing PDFs
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: national-fcc-pdf-census
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.5
      - name: Install dependencies
        run: uv sync --frozen
      # Skips quietly until the compact inventory exists. A failed sync leaves the
      # work list as it was, so checking continues either way.
      - name: Add new inventory filings to the work list
        continue-on-error: true
        timeout-minutes: 35
        run: uv run --no-sync python scripts/national_fcc_collect.py sync --inventory-current
      - name: Check filings until the time limit
        run: |
          uv run --no-sync python scripts/national_fcc_collect.py run --oversize --max-seconds 1800 --workers 1 --rate-start 1 --rate-max 2
          uv run --no-sync python scripts/national_fcc_collect.py run --max-seconds 16200 --workers 16 --rate-start 4 --rate-max 8
