name: Deploy to Vercel

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vercel-deploy.yml"
      - "apps/frontend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vercel.json"
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_GIT_AUTHOR_NAME: ${{ secrets.VERCEL_GIT_AUTHOR_NAME }}
      VERCEL_GIT_AUTHOR_EMAIL: ${{ secrets.VERCEL_GIT_AUTHOR_EMAIL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check Vercel secrets
        run: |
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID secret}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_PROJECT_ID secret}"
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN secret}"
          : "${VERCEL_GIT_AUTHOR_NAME:?Missing VERCEL_GIT_AUTHOR_NAME secret}"
          : "${VERCEL_GIT_AUTHOR_EMAIL:?Missing VERCEL_GIT_AUTHOR_EMAIL secret}"

      # Added for a Vercel Hobby-plan attribution restriction. We are on Pro, where
      # that restriction does not apply, so this is probably dead weight — and it
      # has a cost: amending HEAD means the deployed source's commit hash is not
      # the hash on `main`, which breaks any "which commit is live?" check (#1122).
      # Removal is tracked in #1125 and needs one verified deploy without it first.
      - name: Override the deployed commit's author
        run: |
          git config user.name "$VERCEL_GIT_AUTHOR_NAME"
          git config user.email "$VERCEL_GIT_AUTHOR_EMAIL"
          git commit --amend --no-edit --no-gpg-sign --author="$VERCEL_GIT_AUTHOR_NAME <$VERCEL_GIT_AUTHOR_EMAIL>"

      - name: Deploy production to Vercel
        run: >
          npx --yes vercel@54.4.1 deploy
          --prod
          --yes
          --archive=tgz
          --meta githubCommitSha="$GITHUB_SHA"
          --meta githubCommitRef="$GITHUB_REF_NAME"
          --meta githubRepo="$GITHUB_REPOSITORY"
          --token="$VERCEL_TOKEN"
