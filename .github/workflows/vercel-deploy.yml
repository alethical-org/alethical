name: Deploy to Vercel (manual fallback)

# Normal releases come from Vercel's Git connection. Keep this hand-run so it
# does not automatically duplicate or race those releases.
on:
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check Vercel secrets
        run: |
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID secret}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_PROJECT_ID secret}"
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN secret}"

      - name: Check current main commit
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      # `--build-env ALETHICAL_COMMIT_SHA` is what makes this path's release
      # visible to `.github/workflows/production-release-missing.yml`. That watch
      # reads the commit out of the served page, and the page carries it because
      # `apps/frontend/scripts/stamp-release-commit.mjs` writes it during the
      # build. A Git-connected build gets it from Vercel's own
      # `VERCEL_GIT_COMMIT_SHA`; this path uploads a source archive instead, so
      # nothing here is Git-connected and the commit has to be handed over. Without
      # it, the repair for a missed release would produce a page that cannot say
      # which commit it is, and the watch would keep reporting the outage.
      - name: Deploy production to Vercel
        run: >
          npx --yes vercel@54.4.1 deploy
          --prod
          --yes
          --archive=tgz
          --build-env ALETHICAL_COMMIT_SHA="$GITHUB_SHA"
          --meta githubCommitSha="$GITHUB_SHA"
          --meta githubCommitRef="$GITHUB_REF_NAME"
          --meta githubRepo="$GITHUB_REPOSITORY"
          --token="$VERCEL_TOKEN"
