name: Renew Finance FCC file access
on:
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: national-fcc-read-grant
  cancel-in-progress: false

jobs:
  renew:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Confirm private storage boundaries and renew
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TRIGGER: ${{ github.event_name }}
        run: |
          flags=()
          if [[ "$TRIGGER" == workflow_dispatch ]]; then flags+=(--allow-staged); fi
          uv run --no-sync python -m scripts.national_fcc_db_renew --target production --apply "${flags[@]}"
