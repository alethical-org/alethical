name: Persona benchmark pilot (manual)

# Runs alethical/eval/persona_benchmark/run_pilot.py --mode live -- the
# committed A/B benchmark comparing legislator-persona-chat Condition A
# (current behavior) against Condition B (same behavior + a real
# first-person style-exemplar block). Evaluation infrastructure only: this
# workflow does not deploy anything, does not touch production data or
# behavior, and never runs automatically.
#
# The benchmark imports alethical/api/routers/legislator_chat.py, which does
# not exist on `main` yet (it lives on PR #397 / branch joe/lc-integration).
# BENCHMARK_REF below is a specific commit on a branch built on top of that
# PR's head, carrying both the persona-chat code and the benchmark itself.
#
# BENCHMARK_REF is pinned to a commit SHA, not a branch name or a
# workflow_dispatch input, on purpose (Greptile P1, addressed twice on this
# PR). A free-text ref input would let anyone who can dispatch this workflow
# point the checkout at arbitrary code; a branch NAME closes that but is
# still mutable -- anyone who can push to persona-benchmark-ab-eval could
# still change what code runs with OPENAI_API_KEY available job-wide. A
# commit SHA cannot be moved, so this is the last step in that chain: what
# runs with the key is exactly this commit, full stop. To benchmark a newer
# commit, update this SHA through a reviewed PR to this file -- the same bar
# as any other change that touches a secret-bearing workflow.
env:
  # git rev-parse origin/persona-benchmark-ab-eval, captured 2026-08-16.
  BENCHMARK_REF: 3c7d0cf0b331a29b5057bcf976a73b73d55c8418

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-pilot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: alethical
          POSTGRES_USER: alethical
          POSTGRES_PASSWORD: alethical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethical -d alethical"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://alethical:alethical@localhost:5432/alethical
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out benchmark ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BENCHMARK_REF }}

      - name: Fail fast with a clear message if no key is configured
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not set as a repository or environment secret. Add it under Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations and seed sample fixture data
        run: |
          uv run alembic -c alembic.ini upgrade head
          uv run python scripts/load_sample_data.py

      - name: Run persona benchmark pilot (live)
        run: uv run python -m alethical.eval.persona_benchmark.run_pilot --mode live

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: persona-benchmark-results
          path: alethical/eval/persona_benchmark/results/
          if-no-files-found: warn
