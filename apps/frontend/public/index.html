    />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <script id="alethical-release-recovery">
      (function () {
        var reloadKey = 'alethical.release-program-reload';

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (!(target instanceof HTMLScriptElement) || !target.src) {
              return;
            }

            var source;
            try {
              source = new URL(target.src, window.location.href);
            } catch (_error) {
              return;
            }

            if (
              source.origin !== window.location.origin ||
              !/^\/_expo\/static\/js\/web\/index-[^/]+\.js$/.test(source.pathname)
            ) {
              return;
            }

            try {
              if (window.sessionStorage.getItem(reloadKey)) {
                return;
              }
              window.sessionStorage.setItem(reloadKey, '1');
            } catch (_error) {
              return;
            }

            window.location.reload();
          },
          true,
        );
      })();
    </script>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
