    -->

  <body>
    <script id="alethical-release-recovery">
      (function () {
        var reloadKey = 'alethical.release-program-reload';

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (!(target instanceof HTMLScriptElement) || !target.src) {
              return;
            }

            var source;
            try {
              source = new URL(target.src, window.location.href);
            } catch (_error) {
              return;
            }

            if (
              source.origin !== window.location.origin ||
              !/^\/_expo\/static\/js\/web\/index-[^/]+\.js$/.test(source.pathname)
            ) {
              return;
            }

            try {
              if (window.sessionStorage.getItem(reloadKey)) {
                return;
              }
              window.sessionStorage.setItem(reloadKey, '1');
            } catch (_error) {
              return;
            }

            window.location.reload();
          },
          true,
        );
      })();
    </script>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!--
      The snapshot goes inside the app's own mount point on purpose (issue #1325):
      React clears this element's children on its first render, so the app
      replacing the snapshot is one paint, with no moment where both are on screen
      and no extra script to run. `/` ships it empty because the home page is
      served straight off the filesystem and never reaches api/page.ts.
    -->
    <div id="root"><!--alethical:page-snapshot--><!--/alethical:page-snapshot--></div>
  </body>
